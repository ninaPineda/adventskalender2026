<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sternespiel</title>
  <link rel="stylesheet" href="style.css?v=winter-ui1">

<body>
  <header class="topbar"><a href="index.html">←</a><span>Fortschritt <b class="progress-count">0/24</b></span><span><b class="coin-count">0</b> ⭐</span></header>
  <main>
    <h1>Sternespiel</h1>
    <button class="btn" onclick="document.getElementById('hintDialog').showModal()">Wie spiele ich?</button>
    <dialog id="hintDialog"><p>Tippe die Sterne an, bis das Muster oben stimmt. Für jede gelöste Runde bekommst du Sterne. Alle fünf Stufen steigt die Belohnung.</p><button onclick="document.getElementById('hintDialog').close()">Ok</button></dialog>
    <section class="question stats"><span id="moves"></span><b id="level"></b><span id="tries-display"></span></section>
    <div class="field-container"><div id="target-field" class="target-field"></div><div id="play-field" class="play-field"></div><button class="btn" id="reset-btn">Neu starten</button></div>
    <div id="overlay" class="hidden"><div class="overlay-content"><p id="overlay-text"></p></div></div>
    <div id="failOverlay" class="hidden"></div>
  </main>
