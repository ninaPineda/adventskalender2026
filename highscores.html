<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bestenliste</title>
  <link rel="stylesheet" href="style.css?v=winter-ui1">
</head>
<body>
  <header class="topbar"><b class="progress-count">0/24</b><span><a href="coins.html" class="coin-count">0</a> ⭐</span></header>
  <main><h1>Bestenliste</h1><p class="subtitle">Advent 2026</p><div id="scoreList">Lade...</div></main>
  <nav class="bottombar">
    <a href="highscores.html" aria-current="page" aria-label="Bestenliste"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 4h16v7c0 6-3 9-8 9s-8-3-8-9V4Z"/><path d="M8 7H4v4c0 4 3 6 6 6m14-10h4v4c0 4-3 6-6 6M16 20v6m-6 2h12"/><path d="m16 7 1.3 2.7 3 .4-2.2 2.1.5 3-2.6-1.4-2.6 1.4.5-3-2.2-2.1 3-.4Z"/></svg><span class="nav-label">Bestenliste</span></a>
    <a href="index.html" data-slide="right" aria-label="Start"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 15 16 4l12 11M7 13v15h18V13"/><path d="M13 28V17h6v11M23 5v5"/><path d="M9 13h3m8 0h3"/></svg><span class="nav-label">Start</span></a>
    <a href="profile.html" data-slide="right" aria-label="Profil"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="3" width="22" height="26" rx="9"/><circle cx="16" cy="12" r="4"/><path d="M9 25v-2a7 7 0 0 1 14 0v2"/></svg><span class="nav-label">Profil</span></a>
  </nav>
    <script>
    function onScores(data) {
      const latestPerPlayer = new Map();
      const solvedPerPlayer = new Map();
      data.map((row) => {
        const m = String(row.solved || "").match(/(?:Tag\s*)?(\d+)/i);
        const date = new Date(row.timestamp);
        return m && {
          name: row.name || "Unbekannt",
          tag: Number(m[1]),
          points: Number(String(row.points || 0).replace(",", ".")) || 0,
          timestamp: date.getTime() || 0,
        };
      }).filter(Boolean).forEach((row) => {
        if (!solvedPerPlayer.has(row.name)) solvedPerPlayer.set(row.name, new Set());
        solvedPerPlayer.get(row.name).add(row.tag);
        const old = latestPerPlayer.get(row.name);
        if (!old || row.timestamp > old.timestamp) {
          latestPerPlayer.set(row.name, {
            points: row.points,
            timestamp: row.timestamp,
          });
        }
      });
      const leaders = [...latestPerPlayer].sort((a, b) =>
        b[1].points - a[1].points || solvedPerPlayer.get(b[0]).size - solvedPerPlayer.get(a[0]).size || a[1].timestamp - b[1].timestamp
      );
      const escapeHTML = (value) => String(value).replace(/[&<>"']/g, char => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[char]));
      const initial = (name) => name.trim().charAt(0).toUpperCase();
      const card = ([name, data], rank) => `<div class="podium-card podium-${rank}">
        <span class="crown" aria-hidden="true">♛</span>
        <span class="avatar">${escapeHTML(initial(name))}</span>
        <b>${escapeHTML(name)}</b>
        <span class="coin-pill">${data.points.toLocaleString("de-DE")} ⭐</span>
        <strong>${rank}</strong>
      </div>`;
      const row = ([name, data], i) => `<p class="rank-row">
        <b>${i + 4}</b>
        <span>${escapeHTML(name)}</span>
        <b class="coin-pill">${data.points.toLocaleString("de-DE")} ⭐</b>
      </p>`;
      document.getElementById("scoreList").innerHTML = leaders.length
        ? `<section class="leaderboard-card">
          <div class="podium">
            ${leaders[1] ? card(leaders[1], 2) : ""}
            ${leaders[0] ? card(leaders[0], 1) : ""}
            ${leaders[2] ? card(leaders[2], 3) : ""}
          </div>
        </section>
        <section class="leaderboard-card leaderboard-table">
          <div class="rank-head"><b>Rang</b><b>Spieler</b><b>Sterne</b></div>
          <div class="rank-list">
            ${leaders.slice(3).map(row).join("")}
          </div>
        </section>`
        : "Noch keine Einträge.";
    }
  </script>
  <script src="https://script.google.com/macros/s/AKfycbx4yiiDjuIbqZ2r0DlZVQHbTEXiknKmS0AnVCiMGVSnFhZrnyVW6j_3KjPH22eyM7WRJQ/exec?callback=onScores"></script>
  <script src="app.js?v=winter-ui1"></script>
</body>
</html>
