<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Türchen 8 🎄</title>
  <link rel="stylesheet" href="../style.css" />
  <script src="../app.js" defer></script>
</head>
<body>
  <main class="door-page">
    <a href="../index.html" class="back-button">← Zurück zum Kalender</a>

    <section class="door-content">
      <p class="eyebrow">Türchen <span class="day-number">1</span></p>
      <h1>Dein Rätsel 🧩</h1>

      <p class="riddle">
        Ich habe Städte, aber keine Häuser.<br />
        Ich habe Flüsse, aber kein Wasser.<br />
        Ich habe Wälder, aber keine Bäume.<br />
        Was bin ich?
      </p>

      <div id="solution" data-answer="karte"></div>

      <input
        type="text"
        id="answer"
        class="answer-input"
        placeholder="Deine Antwort..."
        autocomplete="off"
      />

      <button id="check-answer" class="answer-button">Prüfen</button>

      <p class="result" hidden></p>
    </section>
  </main>
</body>
</html>
