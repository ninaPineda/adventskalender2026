<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Rätsel – Adventskalender</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="puzzle-page">

<div class="desktop-block">
  <div class="icon"><i data-lucide="smartphone" aria-hidden="true"></i></div>
  <h1>Nur für Handys!</h1>
  <p>Bitte öffne diese Seite auf deinem Smartphone.</p>
</div>

<!-- PUZZLE HEADER (dynamic) -->
<div class="puzzle-header" id="puzzleHeader">
  <div class="puzzle-header-row">
    <a class="puzzle-back-link" href="index.html" aria-label="Zurück zum Kalender"><i data-lucide="arrow-left" aria-hidden="true"></i></a>
    <div>
      <div class="puzzle-kicker">TAG <span id="dayNum">?</span></div>
      <h1 id="puzzleTitle">Lade...</h1>
    </div>
    <div class="puzzle-points">
      <div class="puzzle-points-label">Max. Punkte</div>
      <div class="puzzle-points-value" id="maxPtsDisplay">–</div>
    </div>
  </div>
  <!-- Best score chip -->
  <div id="bestScoreChip" class="best-score-chip">
    Dein Rekord: <span id="bestScoreVal">0</span> Punkte - Versuch es zu schlagen!
  </div>
</div>

<!-- PUZZLE CONTAINER -->
<div class="page-content puzzle-content" id="puzzleContainer">
  <div class="loading-state">
    <div class="loading-icon"><i data-lucide="loader-circle" aria-hidden="true"></i></div>
    Lade Rätsel...
  </div>
</div>

<!-- RESULT MODAL -->
<div class="modal-overlay" id="resultModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="result-screen">
      <div class="result-emoji" id="resultEmoji"><i data-lucide="party-popper" aria-hidden="true"></i></div>
      <div class="result-title" id="resultTitle">Geschafft!</div>
      <div class="result-pts" id="resultPts">0</div>
      <div class="result-pts-label">Punkte</div>
      <div id="newHighscoreMsg" class="new-highscore-msg">Neuer Rekord!</div>
      <div class="result-actions">
        <button class="btn btn-primary" onclick="window.location.href='index.html'">Zurück zum Kalender</button>
        <button class="btn btn-ghost" onclick="retryPuzzle()">Nochmal versuchen</button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/core.js"></script>
<script src="js/puzzles.js"></script>
<script>
async function initPuzzlePage() {
  applyTheme();
  renderIcons();
  if (!requireLogin()) return;

  const params = new URLSearchParams(location.search);
  const day = parseInt(params.get('day') || '1');

  // Set header
  document.getElementById('dayNum').textContent = day;
  const meta = PUZZLES.find(p => p.day === day);
  const scores = await getScores();
  const unlockState = getPuzzleUnlockState(day, scores);
  if (meta) {
    document.title = `Tag ${day} – ${meta.title}`;
    document.getElementById('puzzleTitle').textContent = meta.title;
    document.getElementById('maxPtsDisplay').innerHTML = `${iconHtml('star', 'badge-icon')} ${meta.maxPts}`;
    document.getElementById('puzzleHeader').style.setProperty('--puzzle-cover', `url(assets/covers/${day}.png)`);
    renderIcons(document.getElementById('maxPtsDisplay'));
  }

  if (!unlockState.unlocked) {
    const container = document.getElementById('puzzleContainer');
    container.innerHTML = `
      <div class="panel locked-panel">
        <div class="locked-panel-icon">${iconHtml('lock')}</div>
        <h2>Dieses Türchen bleibt noch zu.</h2>
        <p>${unlockState.message}</p>
        <a class="btn btn-primary" href="index.html">Zurück zum Kalender</a>
      </div>
    `;
    renderIcons(container);
    return;
  }

  // Check for existing score
  const existingScore = scores[day];
  if (existingScore) {
    document.getElementById('bestScoreChip').style.display = 'block';
    document.getElementById('bestScoreVal').textContent = existingScore.pts;
  }

  // Load & render puzzle
  const puzzleDef = PUZZLE_DEFS[day];
  if (puzzleDef) {
    const container = document.getElementById('puzzleContainer');
    puzzleDef.render(container, (pts) => handleComplete(pts));
  } else {
    document.getElementById('puzzleContainer').innerHTML = `
      <div class="panel empty-puzzle">
        <div class="empty-puzzle-icon">${iconHtml(meta?.icon || 'tree-pine')}</div>
        <p>Dieses Rätsel kommt bald!</p>
      </div>
    `;
  }

  async function handleComplete(pts) {
    pts = normalizePuzzlePoints(pts);
    const isNew = await saveScore(day, pts);

    // Show result modal
    const score = Math.round(pts);
    document.getElementById('resultPts').textContent = score;
    const resultIcon = score >= (meta?.maxPts * 0.8) ? 'trophy' : score >= (meta?.maxPts * 0.5) ? 'party-popper' : 'smile';
    document.getElementById('resultEmoji').innerHTML = iconHtml(resultIcon);
    document.getElementById('resultTitle').textContent = score >= (meta?.maxPts * 0.8) ? 'Ausgezeichnet!' : score >= (meta?.maxPts * 0.5) ? 'Gut gemacht!' : 'Geschafft!';
    if (isNew) {
      document.getElementById('newHighscoreMsg').style.display = 'block';
    }
    document.getElementById('resultModal').classList.add('open');
    renderIcons(document.getElementById('resultModal'));
    updateStreak();
  }

  function retryPuzzle() {
    document.getElementById('resultModal').classList.remove('open');
    const container = document.getElementById('puzzleContainer');
    container.innerHTML = '';
    if (PUZZLE_DEFS[day]) {
      PUZZLE_DEFS[day].render(container, handleComplete);
    }
  }

  window.retryPuzzle = retryPuzzle;
}

initPuzzlePage();
</script>
</body>
</html>
