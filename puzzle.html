<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Rätsel – Adventskalender</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="desktop-block">
  <div class="icon">📱</div>
  <h1>Nur für Handys!</h1>
  <p>Bitte öffne diese Seite auf deinem Smartphone.</p>
</div>

<!-- PUZZLE HEADER (dynamic) -->
<div class="puzzle-header" id="puzzleHeader">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
    <a href="index.html" style="color:white;font-size:1.3rem;text-decoration:none;">←</a>
    <div>
      <div style="font-size:0.8rem;opacity:0.75;font-weight:700;">TAG <span id="dayNum">?</span></div>
      <h1 id="puzzleTitle" style="font-size:1.3rem;">Lade...</h1>
    </div>
    <div style="margin-left:auto;text-align:right;">
      <div style="font-size:0.7rem;opacity:0.75;">Max. Punkte</div>
      <div style="font-family:'Fredoka One',cursive;font-size:1.3rem;" id="maxPtsDisplay">–</div>
    </div>
  </div>
  <!-- Best score chip -->
  <div id="bestScoreChip" style="display:none;background:rgba(255,255,255,0.2);border-radius:12px;padding:6px 12px;font-size:0.8rem;font-weight:700;text-align:center;margin-top:4px;">
    🏅 Dein Rekord: <span id="bestScoreVal">0</span> Punkte – Versuch es zu schlagen!
  </div>
</div>

<!-- PUZZLE CONTAINER -->
<div class="page-content" style="padding-top:0;" id="puzzleContainer">
  <div style="text-align:center;padding:40px 20px;color:var(--text-muted);">
    <div style="font-size:2rem;margin-bottom:8px;">⏳</div>
    Lade Rätsel...
  </div>
</div>

<!-- RESULT MODAL -->
<div class="modal-overlay" id="resultModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="result-screen">
      <div class="result-emoji" id="resultEmoji">🎉</div>
      <div class="result-title" id="resultTitle">Geschafft!</div>
      <div class="result-pts" id="resultPts">0</div>
      <div class="result-pts-label">Punkte</div>
      <div id="newHighscoreMsg" style="display:none;background:rgba(255,215,0,0.15);border-radius:12px;padding:8px 16px;margin:12px 0;color:var(--gold);font-weight:800;">🏆 Neuer Rekord!</div>
      <div style="margin-top:20px;display:flex;flex-direction:column;gap:10px;">
        <button class="btn btn-primary" onclick="window.location.href='index.html'">Zurück zum Kalender 🏠</button>
        <button class="btn btn-ghost" onclick="retryPuzzle()">🔄 Nochmal versuchen</button>
      </div>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/puzzles.js"></script>
<script>
async function initPuzzlePage() {
  applyTheme();
  initSnow(4);

  const params = new URLSearchParams(location.search);
  const day = parseInt(params.get('day') || '1');

  // Set header
  document.getElementById('dayNum').textContent = day;
  const meta = PUZZLES.find(p => p.day === day);
  if (meta) {
    document.title = `Tag ${day} – ${meta.title}`;
    document.getElementById('puzzleTitle').textContent = meta.title;
    document.getElementById('maxPtsDisplay').textContent = '⭐ ' + meta.maxPts;
  }

  // Check for existing score
  const scores = await getScores();
  const existingScore = scores[day];
  if (existingScore) {
    document.getElementById('bestScoreChip').style.display = 'block';
    document.getElementById('bestScoreVal').textContent = existingScore.pts;
  }

  // Load & render puzzle
  const puzzleDef = PUZZLE_DEFS[day];
  if (puzzleDef) {
    const container = document.getElementById('puzzleContainer');
    puzzleDef.render(container, (pts) => handleComplete(pts));
  } else {
    document.getElementById('puzzleContainer').innerHTML = `
      <div class="panel" style="text-align:center;padding:40px 20px;">
        <div style="font-size:3rem;margin-bottom:12px;">${meta?.icon || '🎄'}</div>
        <p style="font-weight:700;color:var(--text-muted);">Dieses Rätsel kommt bald!</p>
      </div>
    `;
  }

  async function handleComplete(pts) {
    const isNew = await saveScore(day, pts);

    // Show result modal
    const score = Math.round(pts);
    document.getElementById('resultPts').textContent = score;
    document.getElementById('resultEmoji').textContent = score >= (meta?.maxPts * 0.8) ? '🏆' : score >= (meta?.maxPts * 0.5) ? '🎉' : '😊';
    document.getElementById('resultTitle').textContent = score >= (meta?.maxPts * 0.8) ? 'Ausgezeichnet!' : score >= (meta?.maxPts * 0.5) ? 'Gut gemacht!' : 'Geschafft!';
    if (isNew) {
      document.getElementById('newHighscoreMsg').style.display = 'block';
      launchConfetti();
    }
    document.getElementById('resultModal').classList.add('open');
    updateStreak();
  }

  function retryPuzzle() {
    document.getElementById('resultModal').classList.remove('open');
    const container = document.getElementById('puzzleContainer');
    container.innerHTML = '';
    if (PUZZLE_DEFS[day]) {
      PUZZLE_DEFS[day].render(container, handleComplete);
    }
  }
}

initPuzzlePage();
</script>
</body>
</html>
