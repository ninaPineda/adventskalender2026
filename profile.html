<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Profil – Adventskalender</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="desktop-block">
  <div class="icon"><i data-lucide="smartphone" aria-hidden="true"></i></div>
  <h1>Nur für Handys!</h1>
  <p>Bitte öffne diese Seite auf deinem Smartphone.</p>
</div>

<nav class="top-nav">
  <div class="logo"><i data-lucide="tree-pine" class="logo-icon" aria-hidden="true"></i> Advent</div>
  <div class="top-tabs" data-active="profile" aria-label="Hauptnavigation">
    <span class="tab-indicator" aria-hidden="true"></span>
    <a class="top-tab" data-tab="calendar" href="index.html">
      <i data-lucide="calendar-days" aria-hidden="true"></i>
      <span>Kalender</span>
    </a>
    <a class="top-tab" data-tab="highscore" href="highscore.html">
      <i data-lucide="trophy" aria-hidden="true"></i>
      <span>Highscore</span>
    </a>
    <a class="top-tab active" data-tab="profile" href="profile.html">
      <i data-lucide="user" aria-hidden="true"></i>
      <span>Profil</span>
    </a>
  </div>
  <div class="nav-actions">
    <div class="streak-badge" id="streakBadge"><i data-lucide="flame" class="badge-icon" aria-hidden="true"></i> 0</div>
    <div class="points-badge" id="pointsBadge"><i data-lucide="star" class="badge-icon" aria-hidden="true"></i> 0</div>
    <button class="theme-switch" id="themeBtn" onclick="toggleThemeSwitch()" type="button" aria-label="Dunkles Design umschalten" aria-pressed="false">
      <span class="theme-switch-knob"></span>
    </button>
  </div>
</nav>

<div class="page-content">

  <!-- Avatar & Name -->
  <div class="panel" style="text-align:center;">
    <div class="avatar-circle" id="avatarCircle"><i data-lucide="user-round" aria-hidden="true"></i></div>
    <div style="font-size:1.5rem;" id="displayName">–</div>
    <div style="color:color-mix(in srgb, var(--ink) 72%, transparent);font-size:0.85rem;margin-top:4px;" id="displayStats">0 Punkte · 0 gelöst</div>
    <button class="btn btn-ghost" style="margin-top:14px;width:auto;padding:10px 20px;" onclick="logout()">Abmelden</button>
  </div>

  <!-- My Stats -->
  <div class="section-label">Deine Statistiken</div>
  <div class="panel">
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-val" id="myTotalPts">–</div>
        <div class="stat-label">Gesamtpunkte</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="mySolvedCount">–</div>
        <div class="stat-label">Gelöst</div>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-val" id="myStreak">–</div>
        <div class="stat-label">Streak</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="myBestDay">–</div>
        <div class="stat-label">Bester Tag</div>
      </div>
    </div>
  </div>

  <!-- Streak Info -->
  <div class="section-label">Streak</div>
  <div class="panel">
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="font-size:3rem;color:var(--tile);"><i data-lucide="flame" class="profile-stat-icon" aria-hidden="true"></i></div>
      <div>
        <div style="font-size:2rem;color:var(--tile);" id="streakCount">0</div>
        <div style="color:color-mix(in srgb, var(--ink) 72%, transparent);font-size:0.85rem;">Tage in Folge aktiv</div>
      </div>
    </div>
    <div style="margin-top:12px;background:var(--paper-soft);border-radius:10px;padding:10px;font-size:0.82rem;color:color-mix(in srgb, var(--ink) 72%, transparent);line-height:1.5;">
      Letzter Besuch: <strong id="lastVisit">–</strong>
    </div>
  </div>

  <!-- Progress -->
  <div class="section-label">Fortschritt</div>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
      <span style="font-weight:700;">Rätsel gelöst</span>
      <span id="progressLabel" style="font-weight:800;color:var(--accent);">0/24</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div id="dayChips" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:12px;"></div>
  </div>

</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/core.js"></script>
<script src="js/puzzles.js"></script>
<script>
  applyTheme();
  initSnow(6);
  const canShowProfile = requireLogin();
  renderIcons();

  async function refreshPage() {
    const name = getUserName();
    const scores = await getScores();
    const streak = await getStreak();
    const solved = Object.values(scores).filter(s=>s.solved).length;
    const total = await getTotalPoints();
    const bestDay = Object.entries(scores).sort((a,b) => b[1].pts-a[1].pts)[0];

    document.getElementById('displayName').textContent = name;
    document.getElementById('displayStats').textContent = total + ' Punkte · ' + solved + ' gelöst';
    document.getElementById('streakCount').textContent = streak.count;
    document.getElementById('myTotalPts').textContent = total;
    document.getElementById('mySolvedCount').textContent = solved + '/24';
    document.getElementById('myStreak').textContent = streak.count;
    document.getElementById('myBestDay').textContent = bestDay ? bestDay[0] : '–';
    document.getElementById('streakBadge').innerHTML = `${iconHtml('flame', 'badge-icon')} ${streak.count}`;
    document.getElementById('pointsBadge').innerHTML = `${iconHtml('star', 'badge-icon')} ${total}`;
    document.getElementById('avatarCircle').innerHTML = iconHtml('user-round');
    renderIcons(document.getElementById('avatarCircle'));
    renderIcons(document.getElementById('streakBadge'));
    renderIcons(document.getElementById('pointsBadge'));

    const lastDay = streak.lastDay;
    document.getElementById('lastVisit').textContent = lastDay ? new Date(lastDay).toLocaleDateString('de-DE') : 'Noch nicht';

    // Progress
    document.getElementById('progressLabel').textContent = solved + '/24';
    document.getElementById('progressFill').style.width = (solved/24*100) + '%';

    // Day chips
    const chips = document.getElementById('dayChips');
    chips.innerHTML = '';
    for (let d=1; d<=24; d++) {
      const s = scores[d];
      const chip = document.createElement('div');
      chip.className = 'profile-day-chip' + (s?.solved ? ' solved' : '');
      chip.style.backgroundImage = `url(assets/covers/${d}.png)`;
      chip.textContent = d;
      chip.title = s ? s.pts + ' Punkte' : 'Nicht gelöst';
      chips.appendChild(chip);
    }

    updateThemeSwitch();
  }

  function logout() {
    clearUserName();
    window.location.href = 'index.html';
  }

  if (canShowProfile) refreshPage();

  function toggleThemeSwitch() {
    toggleTheme();
    refreshPage();
  }

  document.querySelectorAll('.modal-overlay').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
  });
</script>
</body>
</html>
