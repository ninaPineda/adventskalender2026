<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Profil – Adventskalender</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="desktop-block">
  <div class="icon"><i data-lucide="smartphone" aria-hidden="true"></i></div>
  <h1>Nur für Handys!</h1>
  <p>Bitte öffne diese Seite auf deinem Smartphone.</p>
</div>

<nav class="top-nav">
  <div class="logo"><i data-lucide="user" class="logo-icon" aria-hidden="true"></i> Profil</div>
</nav>

<div class="page-content">

  <!-- Avatar & Name -->
  <div class="panel" style="text-align:center;">
    <div class="avatar-circle" id="avatarCircle"><i data-lucide="user-round" aria-hidden="true"></i></div>
    <div style="font-family:'Fredoka One',cursive;font-size:1.5rem;" id="displayName">–</div>
    <div style="color:var(--text-muted);font-size:0.85rem;margin-top:4px;" id="displayStats">0 Punkte · 0 gelöst</div>
    <button class="btn btn-ghost" style="margin-top:14px;width:auto;padding:10px 20px;" onclick="logout()">Abmelden</button>
  </div>

  <!-- Streak Info -->
  <div class="section-label">Streak</div>
  <div class="panel">
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="font-size:3rem;color:var(--streak);"><i data-lucide="flame" class="profile-stat-icon" aria-hidden="true"></i></div>
      <div>
        <div style="font-family:'Fredoka One',cursive;font-size:2rem;color:var(--streak);" id="streakCount">0</div>
        <div style="color:var(--text-muted);font-size:0.85rem;">Tage in Folge aktiv</div>
      </div>
    </div>
    <div style="margin-top:12px;background:var(--input-bg);border-radius:10px;padding:10px;font-size:0.82rem;color:var(--text-muted);line-height:1.5;">
      Letzter Besuch: <strong id="lastVisit">–</strong>
    </div>
  </div>

  <!-- Progress -->
  <div class="section-label">Fortschritt</div>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
      <span style="font-weight:700;">Rätsel gelöst</span>
      <span id="progressLabel" style="font-weight:800;color:var(--green-bright);">0/24</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div id="dayChips" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:12px;"></div>
  </div>

</div>

<nav class="bottom-nav">
  <a class="nav-item" data-page="home" href="index.html">
    <span class="nav-icon"><i data-lucide="home" aria-hidden="true"></i></span><span class="nav-label">Kalender</span>
  </a>
  <a class="nav-item" data-page="highscore" href="highscore.html">
    <span class="nav-icon"><i data-lucide="trophy" aria-hidden="true"></i></span><span class="nav-label">Highscore</span>
  </a>
  <a class="nav-item active" data-page="profile" href="profile.html">
    <span class="nav-icon"><i data-lucide="user" aria-hidden="true"></i></span><span class="nav-label">Profil</span>
  </a>
  <a class="nav-item" data-page="howto" href="howto.html">
    <span class="nav-icon"><i data-lucide="circle-help" aria-hidden="true"></i></span><span class="nav-label">Anleitung</span>
  </a>
</nav>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/core.js"></script>
<script src="js/puzzles.js"></script>
<script>
  applyTheme();
  const canShowProfile = requireLogin();
  renderIcons();

  async function refreshPage() {
    const name = getUserName();
    const scores = await getScores();
    const streak = await getStreak();
    const solved = Object.values(scores).filter(s=>s.solved).length;
    const total = await getTotalPoints();

    document.getElementById('displayName').textContent = name;
    document.getElementById('displayStats').textContent = total + ' Punkte · ' + solved + ' gelöst';
    document.getElementById('streakCount').textContent = streak.count;
    document.getElementById('avatarCircle').innerHTML = iconHtml('user-round');
    renderIcons(document.getElementById('avatarCircle'));

    const lastDay = streak.lastDay;
    document.getElementById('lastVisit').textContent = lastDay ? new Date(lastDay).toLocaleDateString('de-DE') : 'Noch nicht';

    // Progress
    document.getElementById('progressLabel').textContent = solved + '/24';
    document.getElementById('progressFill').style.width = (solved/24*100) + '%';

    // Day chips
    const chips = document.getElementById('dayChips');
    chips.innerHTML = '';
    for (let d=1; d<=24; d++) {
      const s = scores[d];
      const chip = document.createElement('div');
      chip.style.cssText = `
        width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
        font-size:0.65rem;font-weight:800;
        background:var(--card);
        color:${s?.solved ? 'var(--text)' : 'var(--text-muted)'};
        border:1px solid ${s?.solved ? 'var(--text)' : 'var(--card-border)'};
        box-shadow:0 6px 14px rgba(17,17,17,0.05);
      `;
      chip.textContent = d;
      chip.title = s ? s.pts + ' Punkte' : 'Nicht gelöst';
      chips.appendChild(chip);
    }

    updateThemeSwitch();
  }

  function logout() {
    clearUserName();
    window.location.href = 'index.html';
  }

  if (canShowProfile) refreshPage();

  function toggleThemeSwitch() {
    toggleTheme();
    refreshPage();
  }

  document.querySelectorAll('.modal-overlay').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
  });
</script>
</body>
</html>
