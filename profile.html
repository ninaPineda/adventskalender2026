<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Profil</title>
  <link rel="stylesheet" href="style.css?v=winter-ui1">
</head>
<body>
  <header class="topbar"><b class="progress-count">0/24</b><span><a href="coins.html" class="coin-count">0</a> ⭐</span></header>
  <main class="profile-main">
    <h1>Profil</h1>
    <div class="profile-paper"><section class="profile-card">
      <label class="name-field" for="profileNameInput">Dein Name</label>
      <div class="profile-name-row">
        <input id="profileNameInput" class="answer-input" type="text" autocomplete="nickname" maxlength="24" placeholder="Name eintragen">
        <button id="saveNameButton" class="btn" type="button">Speichern</button>
      </div>
      <p id="nameChangeStatus" class="profile-status" aria-live="polite"></p>
      <span id="profileName" hidden></span>
    </section>
    <section class="profile-calendar"><h2>Gelöste Tage</h2><p class="profile-legend">Grün: gelöst · Gold: noch offen</p><div class="profile-days" id="profileDays"></div></section></div>
  </main>
  <nav class="bottombar">
    <a href="highscores.html" data-slide="left" aria-label="Bestenliste"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 4h16v7c0 6-3 9-8 9s-8-3-8-9V4Z"/><path d="M8 7H4v4c0 4 3 6 6 6m14-10h4v4c0 4-3 6-6 6M16 20v6m-6 2h12"/><path d="m16 7 1.3 2.7 3 .4-2.2 2.1.5 3-2.6-1.4-2.6 1.4.5-3-2.2-2.1 3-.4Z"/></svg><span class="nav-label">Bestenliste</span></a>
    <a href="index.html" data-slide="left" aria-label="Start"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 15 16 4l12 11M7 13v15h18V13"/><path d="M13 28V17h6v11M23 5v5"/><path d="M9 13h3m8 0h3"/></svg><span class="nav-label">Start</span></a>
    <a href="profile.html" aria-current="page" aria-label="Profil"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="3" width="22" height="26" rx="9"/><circle cx="16" cy="12" r="4"/><path d="M9 25v-2a7 7 0 0 1 14 0v2"/></svg><span class="nav-label">Profil</span></a>
  </nav>
  <script src="app.js?v=winter-ui1"></script>
</body>
</html>
