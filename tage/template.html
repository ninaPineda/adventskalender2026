<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Adventskalender</title>
  <link rel="stylesheet" href="../style.css?v=paper-1">
  <script src="../theme.js?v=night1"></script>
</head>
<body class="day-page">
  <header class="chat-header">
    <a class="day-back" href="../index.html" aria-label="Zurück"><svg class="paper-icon" viewBox="0 0 64 48" aria-hidden="true"><path class="paper-cut" d="m2 26 31-24 3 12 25-1-2 28-25-4-3 10Z"/><path class="icon-sage" d="m7 26 22-17 2 11 24-2-1 17-25-4-2 9Z"/><path class="icon-green" d="m16 25 13-5v5l22-2v5l-23 1v4Z"/></svg></a>
    <div class="chat-contact">
      <img class="chat-avatar" src="ProfilePic.jpeg" alt="">
      <span class="chat-contact-info"><b>Weihnachtsmann 🎅</b><small>zuletzt am Glühweinstand</small></span>
    </div>
    <span class="day-coin-counter" aria-label="Deine Sterne"><b class="coin-count" aria-live="polite">0</b> <svg class="star-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="m16 2 4.3 9 9.7 1.4-7 6.8 1.7 9.6L16 24.3l-8.7 4.5L9 19.2l-7-6.8 9.7-1.4Z"/></svg></span>
  </header>
  <main class="day-main">
    <h1 class="page-title">Tag</h1>
    <section class="santa-chat" aria-label="Chat mit Santa Clause">
      <div id="daySlot" class="chat-scroll"></div>
      <form id="chatComposer" class="chat-composer" hidden>
        <button id="sendLocationButton" class="chat-icon-button" type="button" aria-label="Standort senden">⌖</button>
        <input id="chatInput" class="chat-input" type="text" autocomplete="off" placeholder="Nachricht">
        <button class="chat-send-button" type="submit" aria-label="Nachricht senden">SENDEN</button>
      </form>
    </section>
  </main>

  <script src="../storage.js?v=compact1"></script>
  <script src="../app.js?v=compact1"></script>
  <script src="gamey.js?v=compact1"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</body>
</html>
