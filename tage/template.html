<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Adventskalender</title>
  <link rel="stylesheet" href="../style.css?v=christmas-chat5">
</head>
<body class="day-page">
  <header class="chat-header">
    <a class="day-back" href="../index.html" aria-label="Zurück">←</a>
    <div class="chat-contact">
      <img class="chat-avatar" src="ProfilePic.jpeg" alt="">
      <span class="chat-contact-info"><b>Weihnachtsmann 🎅</b><small>zuletzt am Glühweinstand</small></span>
    </div>
    <span class="day-coin-counter"><b class="coin-count">0</b> ⭐</span>
  </header>
  <main class="day-main">
    <h1 class="page-title">Tag</h1>
    <section class="santa-chat" aria-label="Chat mit Santa Clause">
      <div id="daySlot" class="chat-scroll"></div>
      <form id="chatComposer" class="chat-composer">
        <button id="sendLocationButton" class="chat-icon-button" type="button" aria-label="Standort senden">⌖</button>
        <input id="chatInput" class="chat-input" type="text" autocomplete="off" placeholder="Nachricht">
        <button class="chat-send-button" type="submit" aria-label="Nachricht senden">↑</button>
      </form>
    </section>
  </main>
  <nav class="bottombar">
    <a href="../highscores.html" data-slide="left" aria-label="Bestenliste"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 4h16v7c0 6-3 9-8 9s-8-3-8-9V4Z"/><path d="M8 7H4v4c0 4 3 6 6 6m14-10h4v4c0 4-3 6-6 6M16 20v6m-6 2h12"/><path d="m16 7 1.3 2.7 3 .4-2.2 2.1.5 3-2.6-1.4-2.6 1.4.5-3-2.2-2.1 3-.4Z"/></svg><span class="nav-label">Bestenliste</span></a>
    <a href="../index.html" aria-current="page" aria-label="Start"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 15 16 4l12 11M7 13v15h18V13"/><path d="M13 28V17h6v11M23 5v5"/><path d="M9 13h3m8 0h3"/></svg><span class="nav-label">Start</span></a>
    <a href="../profile.html" data-slide="right" aria-label="Profil"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="3" width="22" height="26" rx="9"/><circle cx="16" cy="12" r="4"/><path d="M9 25v-2a7 7 0 0 1 14 0v2"/></svg><span class="nav-label">Profil</span></a>
  </nav>
  <script src="../app.js?v=christmas-chat5"></script>
  <script src="gamey.js?v=christmas-chat5"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</body>
</html>
