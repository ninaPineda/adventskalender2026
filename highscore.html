<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Highscore – Adventskalender</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="desktop-block">
  <div class="icon"><i data-lucide="smartphone" aria-hidden="true"></i></div>
  <h1>Nur für Handys!</h1>
  <p>Bitte öffne diese Seite auf deinem Smartphone.</p>
</div>

<nav class="top-nav">
  <div class="logo"><i data-lucide="tree-pine" class="logo-icon" aria-hidden="true"></i> Advent</div>
  <div class="top-tabs" data-active="highscore" aria-label="Hauptnavigation">
    <span class="tab-indicator" aria-hidden="true"></span>
    <a class="top-tab" data-tab="calendar" href="index.html">
      <i data-lucide="calendar-days" aria-hidden="true"></i>
      <span>Kalender</span>
    </a>
    <a class="top-tab active" data-tab="highscore" href="highscore.html">
      <i data-lucide="trophy" aria-hidden="true"></i>
      <span>Highscore</span>
    </a>
    <a class="top-tab" data-tab="profile" href="profile.html">
      <i data-lucide="user" aria-hidden="true"></i>
      <span>Profil</span>
    </a>
  </div>
  <div class="nav-actions">
    <div class="streak-badge" id="streakBadge"><i data-lucide="flame" class="badge-icon" aria-hidden="true"></i> 0</div>
    <div class="points-badge" id="pointsBadge"><i data-lucide="star" class="badge-icon" aria-hidden="true"></i> 0</div>
    <button class="theme-switch" id="themeBtn" onclick="toggleTheme()" type="button" aria-label="Dunkles Design umschalten" aria-pressed="false">
      <span class="theme-switch-knob"></span>
    </button>
  </div>
</nav>

<div class="page-content">

  <!-- Global Leaderboard -->
  <div class="section-label">Gesamtrangliste</div>
  <div class="panel" id="leaderboardPanel">
    <div style="text-align:center;padding:20px;color:color-mix(in srgb, var(--ink) 72%, transparent);">
      <div style="width:28px;height:28px;margin:0 auto 8px;color:var(--accent);"><i data-lucide="loader-circle" style="width:28px;height:28px;" aria-hidden="true"></i></div>
      Lade Rangliste...
    </div>
  </div>

  <!-- Day Records -->
  <div class="section-label">Tagesrekorde</div>
  <div id="dayRecordsPanel"></div>

</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/core.js"></script>
<script>
async function initHighscorePage() {
  applyTheme();
  initSnow(6);
  if (!requireLogin()) return;
  updateThemeSwitch();
  renderIcons();

  const scores = await getScores();
  const streak = await getStreak();
  const total = await getTotalPoints();

  document.getElementById('streakBadge').innerHTML = `${iconHtml('flame', 'badge-icon')} ${streak.count}`;
  document.getElementById('pointsBadge').innerHTML = `${iconHtml('star', 'badge-icon')} ${total}`;
  renderIcons(document.getElementById('streakBadge'));
  renderIcons(document.getElementById('pointsBadge'));

  // Day Records (local + from sheet)
  function buildDayRecords(sheetData) {
    const panel = document.getElementById('dayRecordsPanel');
    const dayScores = {};
    const addDayScore = (day, name, pts) => {
      const d = Number(day);
      if (!d || !name) return;
      if (!dayScores[d]) dayScores[d] = {};
      if (!dayScores[d][name] || pts > dayScores[d][name]) {
        dayScores[d][name] = pts;
      }
    };

    if (Array.isArray(sheetData)) {
      sheetData.forEach(row => {
        const d = getRowDay(row);
        const p = getRowPoints(row);
        addDayScore(d, getRowName(row), p);
      });
    }

    Object.entries(scores).forEach(([day, s]) => {
      addDayScore(day, getUserName(), s.pts);
    });

    panel.innerHTML = '';
    const table = document.createElement('div');
    table.className = 'panel records-table';
    table.innerHTML = `
      <div class="records-row">
        <div>Tag</div>
        <div>Rätsel</div>
        <div class="records-score">Top 3</div>
      </div>
    `;

    for (let d = 1; d <= 24; d++) {
      const meta = PUZZLES.find(p => p.day === d);
      const topThree = Object.entries(dayScores[d] || {})
        .map(([name, pts]) => ({ name, pts }))
        .sort((a, b) => b.pts - a.pts)
        .slice(0, 3);
      const div = document.createElement('div');
      div.className = 'records-row';
      div.innerHTML = `
        <div class="record-cover" style="background-image:url(assets/covers/${d}.png);">
        </div>
        <div class="records-title">${meta?.title || 'Rätsel'}</div>
        <div class="records-podium">
          ${topThree.length ? topThree.map((entry, index) => `
            <div class="records-place">
              <span>${index + 1}</span>
              <strong>${entry.name}</strong>
              <em>${entry.pts}</em>
            </div>
          `).join('') : '<div class="records-empty">Offen</div>'}
        </div>
      `;
      table.appendChild(div);
    }
    panel.appendChild(table);
    renderIcons(panel);
  }

  // Global leaderboard from sheet
  async function loadLeaderboard() {
    let data = [];
    try {
      data = await fetchLeaderboard();
    } catch(e) {}

    // Aggregate by name
    const byName = {};
    if (Array.isArray(data)) {
      data.forEach(row => {
        const name = getRowName(row);
        const pts = getRowPoints(row);
        const day = getRowDay(row);
        if (!day) return;
        if (!byName[name]) byName[name] = { pts: 0, days: new Set() };
        // Only count best per day
        if (!byName[name][day] || pts > byName[name][day]) {
          if (byName[name][day]) byName[name].pts -= byName[name][day];
          byName[name][day] = pts;
          byName[name].pts += pts;
          byName[name].days.add(day);
        }
      });
    }

    // Add local user
    const myName = getUserName();
    if (!byName[myName]) byName[myName] = { pts: 0, days: new Set() };
    Object.entries(scores).forEach(([day, s]) => {
      if (!byName[myName][day] || s.pts > byName[myName][day]) {
        if (byName[myName][day]) byName[myName].pts -= byName[myName][day];
        byName[myName][day] = s.pts;
        byName[myName].pts += s.pts;
        byName[myName].days.add(String(day));
      }
    });

    const sorted = Object.entries(byName).sort((a,b) => b[1].pts - a[1].pts);
    const medals = ['1', '2', '3'];
    const panel = document.getElementById('leaderboardPanel');

    if (sorted.length === 0) {
      panel.innerHTML = `<p style="text-align:center;color:color-mix(in srgb, var(--ink) 72%, transparent);padding:16px;">Noch keine Einträge - sei der Erste!</p>`;
    } else {
      panel.innerHTML = sorted.slice(0, 20).map(([name, info], i) => `
        <div class="leaderboard-item rank-${i+1}">
          <div class="rank-medal">${medals[i] || (i+1) + '.'}</div>
          <div class="rank-name">${name === myName ? `${iconHtml('star', 'badge-icon')} ${name} (Du)` : name}</div>
          <div class="rank-pts">${iconHtml('star', 'badge-icon')} ${info.pts}</div>
        </div>
      `).join('');
    }
    renderIcons(panel);

    buildDayRecords(data);
  }

  loadLeaderboard();
}

initHighscorePage();
</script>
</body>
</html>
